[project]
name = "llm-quant-bench"
version = "0.1.0"
description = "How large a model can an 8GB consumer GPU run?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
lqb = "llm_quant_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_quant_bench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer builds its entire API on function calls in argument defaults, so B008
# flags the framework rather than any mistake. The rule exists to catch mutable
# defaults such as `def f(x=[])`; typer.Option and typer.Argument return
# immutable option descriptors, so the hazard it guards against does not apply.
"src/llm_quant_bench/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
