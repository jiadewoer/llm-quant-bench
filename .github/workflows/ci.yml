name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

      # No GPU and no Ollama on the runner. The checker is expected to report
      # WARN and exit cleanly rather than crash -- that graceful degradation
      # is itself the thing being tested here.
      - name: Env checker degrades gracefully
        run: python scripts/check_env.py
        continue-on-error: true
